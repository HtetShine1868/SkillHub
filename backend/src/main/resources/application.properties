# =================================================================
# SUPABASE POSTGRESQL DATABASE CONFIGURATION
# Set real values in .env (never commit real credentials here)
# =================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# HikariCP Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JWT Configuration (set JWT_SECRET in .env in production; this default is dev-only)
jwt.secret=${JWT_SECRET:skillhub-default-secret-key-change-in-production-minimum-32chars}
jwt.expiration=${JWT_EXPIRATION:86400000}

# OAuth2 Google (set real values in .env to enable Google login)
# Using dummy placeholders so Spring Boot starts even without real credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-placeholder}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# AI Assistant (Gemini)
# Get your FREE API key from: https://aistudio.google.com/app/apikey and set GEMINI_API_KEY in .env
ai.provider=${AI_PROVIDER:gemini}
gemini.api-key=${GEMINI_API_KEY:dummy-placeholder}


# Frontend URL
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# SQL Initialization (Handled by DataInitializer.java)
spring.sql.init.mode=never