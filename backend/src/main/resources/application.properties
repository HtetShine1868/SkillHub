spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:skillhub-default-secret-key-change-in-production-minimum-32chars}
jwt.expiration=${JWT_EXPIRATION:86400000}

# OAuth2 Google (set real values in .env to enable Google login)
# Using dummy placeholders so Spring Boot starts even without real credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-placeholder}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Frontend URL (used by OAuth2SuccessHandler to redirect after login)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}